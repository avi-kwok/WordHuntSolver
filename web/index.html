<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word Hunt Solver</title>
<style>
:root{--sage:#6e9a6a;--dark:#3e5b40;--rim:#9fe39a;--ink:#1d2b1e;--muted:#5d7260;--card:#fff;--wood1:#f4dca8;--wood2:#e0bd7c;--bw:min(92vw,440px);--rf:.85rem}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden}
body{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;color:var(--ink);min-height:100vh;padding:16px 8px 32px;
 background-color:var(--sage);background-image:radial-gradient(rgba(255,255,255,.14) 1.5px,transparent 1.6px),radial-gradient(rgba(0,0,0,.07) 1.5px,transparent 1.6px);
 background-size:22px 22px;background-position:0 0,11px 11px}
main{max-width:900px;margin:0 auto}
.hidden{display:none!important}
.hcard{width:var(--bw);margin:0 auto 16px;background:#fff;border-radius:14px;box-shadow:0 4px 14px rgba(0,0,0,.22);padding:14px 18px;text-align:center}
.hcard h1{margin:0;font-size:1.6rem;font-weight:900;letter-spacing:.5px}
.hcard p{margin:4px 0 0;color:var(--muted);font-size:.9rem;font-weight:600}
.hres{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left}
.words{font-size:.85rem;font-weight:800;letter-spacing:.5px;color:var(--muted)}
.score{font-size:2.2rem;font-weight:900;line-height:1.1;letter-spacing:1px;font-variant-numeric:tabular-nums}
.chip{background:var(--dark);color:var(--rim);font-weight:800;font-size:.85rem;border-radius:999px;padding:6px 12px;white-space:nowrap;box-shadow:inset 0 2px 4px rgba(0,0,0,.35)}
.board{position:relative;width:var(--bw);margin:0 auto;background:var(--dark);border:6px solid var(--rim);border-radius:18px;padding:12px;
 display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;box-shadow:0 8px 20px rgba(0,0,0,.35)}
.board input,.tile{aspect-ratio:1;width:100%;min-width:0;border-radius:8px;border:0;padding:0;
 background:repeating-linear-gradient(100deg,rgba(120,80,20,.05) 0 2px,transparent 2px 7px),linear-gradient(145deg,var(--wood1),var(--wood2));
 box-shadow:inset 0 2px 0 rgba(255,255,255,.55),inset 0 -3px 0 rgba(120,80,20,.25),0 4px 0 #a98a52,0 6px 8px rgba(0,0,0,.4);
 font-family:"Arial Black",system-ui,Helvetica,Arial,sans-serif;font-weight:900;color:#000;text-transform:uppercase;text-align:center;
 font-size:calc(var(--bw)*.15)}
.board input{outline:none;caret-color:var(--rim)}
.board input:focus{box-shadow:inset 0 2px 0 rgba(255,255,255,.55),0 0 0 4px var(--rim),0 6px 8px rgba(0,0,0,.4)}
.tile{display:flex;align-items:center;justify-content:center}
.board .tile.on,.board .tile.start{background:#fff}
.tile.start{box-shadow:inset 0 2px 0 rgba(255,255,255,.55),0 4px 0 #a98a52,0 6px 8px rgba(0,0,0,.4)}
.board svg{position:absolute;left:12px;top:12px;pointer-events:none;overflow:visible}
.all{display:block;width:var(--bw);margin:16px auto 0;color:#fff;font-weight:800;font-size:.9rem;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.all input{display:block;width:100%;margin-top:6px;padding:12px 14px;border-radius:12px;border:3px solid var(--dark);font-size:1.15rem;font-weight:800;letter-spacing:3px;text-transform:uppercase;font-family:inherit;background:#fff;color:var(--ink);outline:none}
.all input:focus{border-color:var(--rim);box-shadow:0 0 0 3px var(--dark)}
.btns{display:flex;gap:10px;justify-content:center;margin-top:16px}
button{font:inherit;font-weight:800;border:0;border-radius:14px;padding:12px 26px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.3),0 6px 10px rgba(0,0,0,.2);color:var(--ink)}
button:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.3)}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.primary{background:var(--rim);color:#12301a}
.secondary{background:#fff}
button:disabled{opacity:.5;cursor:not-allowed}
.err{color:#fff;background:#a42a1a;border-radius:10px;padding:8px 12px;margin:12px auto 0;width:var(--bw);text-align:center;font-weight:700}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px}
.col{min-width:0;background:var(--card);border-radius:14px;padding:5px 6px;box-shadow:0 4px 12px rgba(0,0,0,.22)}
.col h2{margin:0 0 6px;font-size:.95rem;text-align:center;font-weight:900;color:var(--dark)}
.row{display:grid;grid-template-columns:1.6em 1fr auto auto;gap:5px;align-items:baseline;padding:1px 4px;line-height:1.2;border-radius:8px;cursor:pointer;font-size:var(--rf)}
.row:hover{background:#e8f5e6}
.row.sub{padding-left:1.4em;font-size:calc(var(--rf)*.88);color:#6b7d6d;font-weight:500}
.row.sub .w{font-weight:600}
.row.sub .p{font-weight:500}
.tag{font-size:.65em;font-weight:700;color:var(--muted);margin-left:4px;text-transform:none;letter-spacing:0}
.row.seed .w{font-weight:900}
.blk .row:not(.seed):not(.sub) .w{font-weight:600}
.blk{margin:0 0 4px;padding:1px 2px;border:2px solid #1d2b1e;border-radius:10px;background:#fff}
.blk.lite{border:none;background:transparent}
.bh{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 4px;padding:1px 4px 0;line-height:1.2;font-size:var(--rf);color:var(--dark)}
.bh .bn{color:var(--muted);min-width:1.6em}
.bh .bm,.bh .br{font-size:.78em;color:var(--muted);font-weight:600}
.row:hover{background:#d6efd3}
.row.sel{background:var(--rim)}
.gt{font-size:.62em;font-weight:800;color:var(--muted);margin-left:4px;letter-spacing:0;white-space:nowrap}
.row .r{color:var(--muted);text-align:right}
.row .w{font-weight:900;letter-spacing:.5px;overflow:hidden;text-overflow:ellipsis;min-width:0}
.row .p{text-align:right;font-variant-numeric:tabular-nums}
.row .z{color:var(--muted);font-size:.75rem;width:2em;text-align:right}
.foot{margin:14px 0 0;color:#fff;text-align:center;font-weight:700;font-size:.85rem;line-height:1.6;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.empty{color:var(--muted);text-align:center;padding:8px;font-size:.8rem}
@media(min-width:760px){:root{--rf:.95rem}.col h2{font-size:1.05rem}}
@media(max-width:519px){:root{--rf:.62rem}.row .z{display:none}.row{grid-template-columns:1.5em 1fr auto;gap:3px;padding:1px 2px}.col{padding:4px 3px}.col h2{font-size:.7rem}.row.sub{padding-left:.8em}.bh .br{display:none}.blk{margin-bottom:3px}.board{gap:8px;padding:10px}.board svg{left:10px;top:10px}.score{font-size:1.8rem}.hcard h1{font-size:1.3rem}}
</style>
</head>
<body>
<main>

<section id="s1">
 <div class="hcard"><h1>Word Hunt Solver</h1><p>Type the board left&rarr;right, top&rarr;bottom</p></div>
 <div class="board" id="grid"></div>
 <label class="all">or type all 16 letters
  <input id="all" maxlength="40" autocomplete="off" autocapitalize="characters" spellcheck="false">
 </label>
 <div id="err" class="err hidden"></div>
 <div class="btns">
  <button class="secondary" id="clear">Clear</button>
  <button class="primary" id="solve" disabled>Solve</button>
 </div>
</section>

<section id="s2" class="hidden">
 <div class="hcard hres"><div><div class="words" id="hw"></div><div class="score" id="hs"></div></div><span class="chip" id="hm"></span></div>
 <div class="board" id="mini"><svg id="lines"></svg></div>
 <div class="cols">
  <div class="col"><h2>Common</h2><div id="c1"></div></div>
  <div class="col"><h2>Less common</h2><div id="c2"></div></div>
  <div class="col"><h2>Rare</h2><div id="c3"></div></div>
 </div>
 <p class="foot" id="foot"></p>
 <div class="btns"><button class="primary" id="newb">New board</button></div>
</section>
</main>

<script>
(function(){
var $=function(i){return document.getElementById(i)};
var grid=$("grid"),allI=$("all"),solveB=$("solve"),errB=$("err");
var cells=[],letters=new Array(16).fill("");

for(var i=0;i<16;i++){
 var inp=document.createElement("input");
 inp.maxLength=1;inp.autocomplete="off";inp.autocapitalize="characters";inp.spellcheck=false;
 inp.setAttribute("aria-label","row "+(Math.floor(i/4)+1)+" column "+(i%4+1));
 inp.dataset.i=i;grid.appendChild(inp);cells.push(inp);
}

function sync(fromAll){
 for(var i=0;i<16;i++)cells[i].value=letters[i];
 if(!fromAll)allI.value=letters.join("");
 solveB.disabled=letters.some(function(l){return !l});
}
function fill(str,start){
 var s=str.replace(/[^A-Za-z]/g,"").toUpperCase(),k=start;
 for(var j=0;j<s.length&&k<16;j++,k++)letters[k]=s[j];
 return k;
}
function focus(i){if(i>=0&&i<16){cells[i].focus();cells[i].select()}}

grid.addEventListener("input",function(e){
 var i=+e.target.dataset.i,v=e.target.value.replace(/[^A-Za-z]/g,"").toUpperCase();
 if(v.length>1){var k=fill(v,i);sync();focus(Math.min(k,15));return}
 letters[i]=v;sync();
 if(v)focus(i+1);
});
grid.addEventListener("paste",function(e){
 var t=(e.clipboardData||window.clipboardData).getData("text");
 if(t.replace(/[^A-Za-z]/g,"").length>1){
  e.preventDefault();
  var s=t.replace(/[^A-Za-z]/g,"");
  letters=new Array(16).fill("");
  var k=fill(s,0);sync();focus(Math.min(k,15));
 }
});
grid.addEventListener("keydown",function(e){
 var i=+e.target.dataset.i;
 if(e.key==="Backspace"&&!letters[i]&&i>0){e.preventDefault();letters[i-1]="";sync();focus(i-1)}
 else if(e.key==="ArrowLeft"){e.preventDefault();focus(i-1)}
 else if(e.key==="ArrowRight"){e.preventDefault();focus(i+1)}
 else if(e.key==="ArrowUp"){e.preventDefault();focus(i-4)}
 else if(e.key==="ArrowDown"){e.preventDefault();focus(i+4)}
 else if(e.key==="Enter"){submit()}
});
grid.addEventListener("focusin",function(e){if(e.target.select)e.target.select()});

allI.addEventListener("input",function(){
 letters=new Array(16).fill("");fill(allI.value,0);
 allI.value=allI.value.replace(/[^A-Za-z]/g,"").toUpperCase().slice(0,16);
 sync(true);
});
allI.addEventListener("keydown",function(e){if(e.key==="Enter")submit()});

$("clear").onclick=function(){letters=new Array(16).fill("");sync();hideErr();focus(0)};
solveB.onclick=submit;

function showErr(m){errB.textContent=m;errB.classList.remove("hidden")}
function hideErr(){errB.classList.add("hidden")}

function submit(){
 if(solveB.disabled)return;
 hideErr();solveB.disabled=true;
 fetch("/api/solve",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({board:letters.join("")})})
 .then(function(r){return r.json().then(function(d){return {ok:r.ok,d:d}})})
 .then(function(x){
  if(!x.ok){showErr(x.d.error||"Error");return}
  show(x.d);
 })
 .catch(function(){showErr("Could not reach the server.")})
 .then(function(){sync()});
}

var mini=$("mini"),lines=$("lines"),tiles=[],cur=null;
function show(d){
 $("s1").classList.add("hidden");$("s2").classList.remove("hidden");
 while(mini.firstChild&&mini.firstChild!==lines)mini.removeChild(mini.firstChild);
 while(mini.lastChild!==lines)mini.removeChild(mini.lastChild);tiles=[];cur=null;
 for(var i=0;i<16;i++){var t=document.createElement("div");t.className="tile";t.textContent=d.board[i];mini.insertBefore(t,lines);tiles.push(t)}
 lines.innerHTML="";
 $("hw").textContent="WORDS: "+d.total_words;
 $("hs").textContent="SCORE: "+String(d.total_points).padStart(4,"0");
 $("hm").textContent=d.solve_ms+" ms";
 col($("c1"),d.common);col($("c2"),d.less_common);col($("c3"),d.rare);
 $("foot").innerHTML="Common: shown "+countLines(d.common)+" of "+d.common_total+
  "<br>Less common: shown "+countLines(d.less_common)+" of "+d.less_common_total+
  "<br>Rare: shown "+countLines(d.rare)+" of "+d.rare_total+
  "<br>"+d.total_words+" words, "+d.total_points+" points<br>Solved in "+d.solve_ms+" ms";
}
var sel=null;
function countLines(rows){return rows.reduce(function(a,r){return a+1+r.forms.length},0)}
/*UNITS*/
function buildUnits(rows){
 var units=[],prev=null,u=null,n=0;
 rows.forEach(function(r){
  if(!u||r.group_key!==prev){
   prev=r.group_key;
   u={rank:++n,rows:[],size:r.group_size,points:r.group_points,rate:r.group_rate};
   units.push(u);
  }
  u.rows.push(r);
 });
 units.forEach(function(u){
  var words=0;u.rows.forEach(function(r){words+=1+r.forms.length});
  u.words=words;
  var hasForms=words>u.rows.length;
  u.kind=u.rows.length>=2?"block":(hasForms?"light":"plain");
 });
 return units;
}
/*ENDUNITS*/
function col(el,rows){
 el.innerHTML="";
 if(!rows.length){el.innerHTML='<div class="empty">none</div>';return}
 function add(parent,r,cls,mark,tag,seed){
  var d=document.createElement("div");d.className="row"+cls+(seed?" seed":"");
  d.innerHTML='<span class="r"></span><span class="w"></span><span class="p">'+r.points+'</span><span class="z">'+r.zipf.toFixed(1)+'</span>';
  d.querySelector(".r").textContent=mark;
  var w=d.querySelector(".w");w.textContent=r.word.toUpperCase();
  if(r.base&&cls!==" sub"){var t=document.createElement("span");t.className="tag";t.textContent="from "+r.base.toUpperCase();w.appendChild(t)}
  if(tag){var g=document.createElement("span");g.className="gt";g.textContent=tag;w.appendChild(g)}
  d.onclick=function(e){
   e.stopPropagation();
   if(sel)sel.classList.remove("sel");
   sel=d;d.classList.add("sel");highlight(r.path);
  };
  parent.appendChild(d);
 }
 buildUnits(rows).forEach(function(u){
  if(u.kind==="plain"){
   var r=u.rows[0];
   add(el,r,"",u.rank+".",Math.round(u.rate)+"/s",false);
   return;
  }
  var box=document.createElement("div");box.className="blk "+(u.kind==="block"?"big":"lite");
  var h=document.createElement("div");h.className="bh";
  var rate=u.kind==="block"?'<span class="br"> \u00b7 '+Math.round(u.rate)+'/s</span>':"";
  h.innerHTML='<span class="bn">'+u.rank+'.</span><b>'+u.points+' pts</b><span class="bm"> \u00b7 '+u.words+' words</span>'+rate;
  box.appendChild(h);
  u.rows.forEach(function(r,i){
   add(box,r,"",u.kind==="block"?"\u2022":"",null,i===0&&u.kind==="block");
   r.forms.forEach(function(f){add(box,f," sub","+",null,false)});
  });
  el.appendChild(box);
 });
}
function draw(){
 if(!cur||!tiles.length)return;
 var w=mini.clientWidth,h=mini.clientHeight,cs=getComputedStyle(mini),px=parseFloat(cs.paddingLeft),py=parseFloat(cs.paddingTop);
 var iw=w-2*px,ih=h-2*py;
 lines.setAttribute("width",iw);lines.setAttribute("height",ih);lines.setAttribute("viewBox","0 0 "+iw+" "+ih);
 var tw=tiles[0].offsetWidth;
 var pts=cur.map(function(c){var t=tiles[c];return (t.offsetLeft-px+t.offsetWidth/2)+","+(t.offsetTop-py+t.offsetHeight/2)});
 var p0=pts[0].split(",");
 lines.innerHTML='<polyline points="'+pts.join(" ")+'" fill="none" stroke="#d9534f" stroke-opacity=".75" stroke-width="'+(tw*0.1)+'" stroke-linecap="round" stroke-linejoin="round"/>'+
  '<circle cx="'+p0[0]+'" cy="'+p0[1]+'" r="'+(tw*0.12)+'" fill="#d9534f" stroke="#fff" stroke-width="2"/>';
}
function highlight(path){
 cur=path;
 tiles.forEach(function(t){t.className="tile"});
 path.forEach(function(c,k){tiles[c].className="tile "+(k===0?"start":"on")});
 draw();
}
window.addEventListener("resize",draw);
$("newb").onclick=function(){
 $("s2").classList.add("hidden");$("s1").classList.remove("hidden");
 if(sel)sel.classList.remove("sel");sel=null;cur=null;tiles=[];lines.innerHTML="";
 ["c1","c2","c3"].forEach(function(id){$(id).innerHTML=""});$("foot").innerHTML="";
 letters=new Array(16).fill("");allI.value="";sync();hideErr();
 window.scrollTo(0,0);focus(0);
};
sync();focus(0);
})();
</script>
</body>
</html>
